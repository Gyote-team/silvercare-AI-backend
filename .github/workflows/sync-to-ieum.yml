name: Sync to ieum-connect

on:
  push:
    branches:
      - automation/ieum-sync

concurrency:
  group: sync-medi-bridge-ai-backend
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.IEUM_SYNC_APP_ID }}
          private-key: ${{ secrets.IEUM_SYNC_APP_PRIVATE_KEY }}
          owner: ieum-connect
          repositories: MediBridge_AI_backend

      - name: Build filtered mirror
        env:
          SOURCE_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          mkdir -p ../mirror-source
          git archive HEAD | tar -x -C ../mirror-source
          git switch --orphan mirror
          git rm -rf . || true
          cp -R ../mirror-source/. .
          rm -rf .github/workflows README.md docs
          git add -A
          git -c user.name="ieum-sync" -c user.email="ieum-sync[bot]@users.noreply.github.com" commit -m "$SOURCE_MESSAGE"

      - name: Push to ieum-connect
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git remote add destination "https://x-access-token:${TOKEN}@github.com/ieum-connect/MediBridge_AI_backend.git"
          git push destination HEAD:main --force
