[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "silvercare-ai-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",            # 내부 HTTP API 서버
    "uvicorn[standard]>=0.30",   # ASGI 서버 실행
    "pydantic>=2",               # 요청·응답 모델 검증
    "pydantic-settings>=2",      # 환경 변수 설정 로딩
    "sqlalchemy>=2",             # PostgreSQL ORM
    "psycopg[binary]>=3",        # PostgreSQL 드라이버
    "pymupdf>=1.24",             # PDF 페이지 분리와 렌더링
    "pillow>=10",                # 이미지 전처리
    "httpx>=0.27",               # Spring callback HTTP client, TestClient
]

[project.optional-dependencies]
dev = [
    "pytest>=8",   # 테스트 실행
    "ruff>=0.6",   # 린트와 import 정렬
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
